name: validate
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON parses
        shell: pwsh
        # -Force: on Linux, .NET marks dot directories (.claude-plugin, .agents) as hidden and skips them otherwise
        run: Get-ChildItem -Recurse -Force -Filter *.json -File | Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } | ForEach-Object { Get-Content -Raw $_.FullName | ConvertFrom-Json | Out-Null; $_.FullName }
      - name: Manifest versions agree
        shell: pwsh
        run: |
          $a = (Get-Content -Raw plugins/asd-ste100-style/.claude-plugin/plugin.json | ConvertFrom-Json).version
          $b = (Get-Content -Raw plugins/asd-ste100-style/plugin.json | ConvertFrom-Json).version
          if ($a -ne $b) { throw "version mismatch: $a vs $b" }
      - name: Marketplace sources point at the plugin
        shell: pwsh
        run: |
          $c = (Get-Content -Raw .claude-plugin/marketplace.json | ConvertFrom-Json).plugins[0].source
          $x = (Get-Content -Raw .agents/plugins/marketplace.json | ConvertFrom-Json).plugins[0].source.path
          foreach ($p in $c, $x) { if (-not (Test-Path -LiteralPath (Join-Path $p '.claude-plugin/plugin.json'))) { throw "marketplace source has no plugin: $p" } }
      - name: dist zips match working tree
        shell: pwsh
        run: ./scripts/build-dist.ps1 -Check
      - name: Eval scripts pass their selftests and reproduce the recorded decisions
        run: |
          python3 -I -B tests/eval/run_cli_eval.py selftest
          python3 -I -B tests/eval/heldout2_decide.py selftest
          python3 -I -B tests/eval/heldout3_decide.py selftest
          python3 -I -B -X utf8 tests/eval/heldout2_decide.py tests/heldout2-eval-2026-11-12.json | grep -q '"decision": "revert SKILL.md to 1.1.1"'
